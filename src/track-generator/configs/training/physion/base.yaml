model:
  name: latte(B, stride=${model.nn.trajectory_stride}, patch_size=${model.nn.patch_size})
  nn:
    image_size: 256
    input_size: 32
    in_channels: 2
    trajectory_length: 30
    patch_size: 2
    trajectory_stride: 2
    frame_features_dim: 1024
    num_frame_tokens: 324
    latent: False
  flow_matcher: target_conditional_flow_matcher

training:
  # 118388 examples in total, 118388 // 4 = 29,597 per gpu, 29,597 / 4 = 7400 steps
  batch_size: 4  # effective batch size is 4 (batch_size) * 4 (world_size) * 2 (gradient accumulation) = 32
  num_workers: 8
  lr: 0.00006
  seed: 42
  use_amp: true
  use_wandb: true
  epochs: 4096
  num_steps_per_epoch: 7400
  log_every_steps: 2
  checkpoint_every_epochs: 1
  checkpoint_every_steps: 2048
  sample_every_steps: 2048
  num_trajectories_per_reference_frame: 1024
  samples_path: /scratch/shared/beegfs/gabrijel/experiments/track-generator/${dataset.name}/${model.name}/${preprocessing.starting_frame}/samples/train
  checkpoints_path: /scratch/shared/beegfs/gabrijel/experiments/track-generator/${dataset.name}/${model.name}/${preprocessing.starting_frame}/checkpoints
  lr_scheduler: linear
  warmup_steps: 2048
  gradient_accumulation_steps: 2
  sampling:
    type: none
    num_trajectories: 1024
  clip_grad_norm: 1.0
  
sampling:
  num_trajectories_per_reference_frame: 4096
  num_samples: 4
  sampling_trajectory_lengths:
    - 30
  method: euler
  steps: 10
  rtol: 1.0e-05
  atol: 1.0e-05
  seed: 42

evaluation:
  samples_path: /scratch/shared/beegfs/gabrijel/experiments/track-generator/${dataset.name}/${model.name}/${preprocessing.starting_frame}/samples/validation

dataset:
  name: physion
  path: /scratch/shared/beegfs/gabrijel/datasets/sharded/Physion1.5/
  image_size: ${model.nn.image_size}
  cache: false

preprocessing:
  max_width: ${model.nn.image_size}
  max_height: ${model.nn.image_size}
  pixel_mean: [0.4375, 0.4345, 0.4278]
  pixel_std: [0.0728, 0.0711, 0.0801]
  time:
    - forward
  starting_frame: 0